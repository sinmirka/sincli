[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sincli"
version = "1.0.0"
description = "Terminal text formatting and gradient utilities"
requires-python = ">=3.10"
dependencies = [
    "pyfiglet>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]